# =============================================================================
# KITTY TERMINAL CONFIGURATION: SAKURA & AUTUMN ROSE (PASTEL LUXE)
# =============================================================================

# --- Typography & Font Rendering ---
font_family             JetBrainsMono Nerd Font
bold_font               auto
italic_font             auto
bold_italic_font        auto
font_size               11.5
modify_font cell_height 112%
modify_font baseline    0

# --- Window Layout & Spacing ---
window_padding_width    18 22
placement_strategy      center
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    no
initial_window_width    960
initial_window_height   620

# --- Window Borders ---
window_border_width     1.5pt
active_border_color     #f4a7b9
inactive_border_color   #352531
bell_border_color       #f5c280

# --- Cursor & Interaction ---
cursor                  #f4a7b9
cursor_text_color       #1c141a
cursor_shape            beam
cursor_beam_thickness   2.0
cursor_blink_interval   0.5
cursor_stop_blinking_after 20.0
mouse_hide_wait         3.0
enable_audio_bell       no

# --- URLs & Links ---
url_color               #f7b2c4
url_style               curly
open_url_with           default
detect_urls             yes

# --- Tab Bar Styling (Slanted Powerline) ---
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
active_tab_foreground   #1c141a
active_tab_background   #f4a7b9
active_tab_font_style   bold
inactive_tab_foreground #b89fae
inactive_tab_background #2a1d26
inactive_tab_font_style normal
tab_bar_background      #140e13
tab_bar_margin_width    6
tab_bar_margin_height   6 0

# --- Opacity & Background ---
background_opacity      0.88
background              #1c141a
foreground              #faedf2
selection_background    #543345
selection_foreground    #faedf2

# =============================================================================
# 16-COLOR PALETTE: SAKURA & AUTUMN ROSE
