# =============================================================================
# HYPRLOCK: AUTUMN KEMONO LOCKSCREEN
# =============================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = /home/snaywart/.config/hypr/wallpapers/autumn_kemono.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.89
    brightness = 0.80
    vibrancy = 0.22
}

# Ввод пароля
input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(230, 167, 60, 0.8)
    inner_color = rgba(36, 26, 21, 0.9)
    font_color = rgb(252, 239, 230)
    fade_on_empty = false
    placeholder_text = <span foreground="##cfb29e"><i>Введите пароль...</i></span>
    hide_input = false
    check_color = rgba(216, 107, 39, 0.9)
    fail_color = rgba(190, 56, 47, 0.9)
    fail_text = <i>Неверный пароль <b>($ATTEMPTS)</b></i>
    position = 0, -120
    halign = center
    valign = center
}

# Кнопки действий под полем ввода (Питание, Перезагрузка, Сон)
shape {
    monitor =
    size = 280, 42
    color = rgba(36, 26, 21, 0.85)
    rounding = 14
    border_size = 1
    border_color = rgba(244, 167, 185, 0.4)
    position = 0, -180
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground="##f4a7b9">󰐥 Выкл</span>    <span foreground="##f5c280">󰜉 Ребут</span>    <span foreground="##9ec885">󰤄 Сон</span>
    color = rgba(252, 239, 230, 0.95)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -180
    halign = center
    valign = center
}

# Текущее время (крупные стильные часы)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(252, 239, 230, 0.95)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 4
}

# Текущая дата (сентябрь, день недели)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(230, 167, 60, 0.9)
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 70
    halign = center
    valign = center
    shadow_passes = 2
}

# Цитата / Приветствие
label {
    monitor =
    text = 󰮯 Золотая Осень • snaywart
    color = rgba(207, 178, 158, 0.8)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}
